<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Latin So7 Quiz</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f7f8fc;color:#172033;margin:0;padding:24px}main{max-width:660px;margin:35px auto}header{text-align:center;margin-bottom:26px}h1{font-size:32px;margin:0 0 7px}p{color:#5b6475}.card{background:white;border:1px solid #e2e6ef;border-radius:20px;padding:28px;box-shadow:0 12px 35px #152b4c0b}.top{display:flex;justify-content:space-between;color:#657187;font-weight:600;font-size:14px}.track{background:#edf0f6;height:9px;border-radius:30px;margin:17px 0 25px;overflow:hidden}.fill{height:100%;background:#6366f1;width:0;transition:width .2s}.word{text-align:center;font-size:38px;font-weight:800;margin:25px 0 28px;color:#242d54}label{display:block;font-weight:650;font-size:14px;margin:18px 0 7px}input{width:100%;border:1px solid #cdd4e0;border-radius:10px;padding:14px;font-size:16px;background:#fff;color:#172033}input:focus{outline:2px solid #818cf8;border-color:#818cf8}button{border:0;border-radius:11px;background:#4f46e5;color:white;padding:14px 19px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:18px}button.secondary{background:#eef0ff;color:#4338ca}.feedback{margin-top:20px;border-radius:12px;background:#f8f9fc;padding:16px}.line{margin:9px 0;line-height:1.5}.ok{color:#147d50}.bad{color:#b42318}.small{font-size:13px;color:#687386}footer{text-align:center;margin-top:20px;color:#687386;font-size:13px}@media(max-width:520px){body{padding:14px}main{margin:14px auto}.card{padding:20px}.word{font-size:33px}}</style></head><body><main><header><h1>Latin So7 Quiz ✨</h1><p>25 words · Principal parts · Meaning · Classification</p></header><section class="card"><div class="top"><span id="progress">Word 1 of 25</span><span id="score">Score: 0 / 75</span></div><div class="track"><div id="bar" class="fill"></div></div><div id="quiz"></div></section><footer>Practice one word at a time. You've got this! :3</footer></main><script>const words=[["ceno","ceno, cenare, cenavi","eat dinner","1CV"],["centurio","centurio, centurionis, m","centurion","3DN"],["cum","cum","with","preposition"],["facio","facio, facere, feci","do, make","3ioCV"],["heri","heri","yesterday","adverb"],["ingens","ingens, ingentis","huge","3DA"],["intellego","intellego, intellegere, intellexi","understand","3CV"],["lacrimo","lacrimo, lacrimare, lacrimavi","cry, weep","1CV"],["mortuus","mortuus, mortua, mortuum","dead","1,2DA"],["narro","narro, narrare, narravi","tell","1CV"],["neco","neco, necare, necavi","kill","1CV"],["nihil","nihil, nihili, n","nothing","2DN"],["omnis","omnis, omnis, omne","every, all","3DA"],["paro","paro, parare, paravi","prepare","1CV"],["pestis","pestis, pestis, f","plague","3DN"],["conspicio","conspicio, conspicere, conspexi","glimpse","3ioCV"],["poculum","poculum, poculi, n","cup","2DN"],["procedo","procedo, procedere, processi","advance, proceed","3CV"],["prope","prope","near","preposition"],["pulcher","pulcher, pulchra, pulchrum","beautiful","1,2DA"],["rogo","rogo, rogare, rogavi","ask","1CV"],["tacite","tacite","quietly","adverb"],["tamen","tamen","however","adverb"],["terreo","terreo, terrere, terrui","frighten","2CV"],["umbra","umbra, umbrae, f","ghost","1DN"]];let order=words.map((_,i)=>i),pos=0,score=0,missed=[],done=false;const q=document.getElementById('quiz'),p=document.getElementById('progress'),s=document.getElementById('score'),bar=document.getElementById('bar');function norm(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}function partsOk(input,answer){return norm(input)===norm(answer)}function meaningOk(input,answer){const a=norm(input);return answer.split(',').some(x=>norm(x)===a)||({eatdinner:['dine','have dinner'],centurion:['roman centurion'],huge:['enormous','gigantic','very large'],understand:['comprehend'],nothing:['none'],plague:['disease'],glimpse:['catch sight of','see'],advance:['move forward'],near:['close to'],beautiful:['pretty'],however:['nevertheless'],ghost:['shade','spirit'],frighten:['scare'],cry:['weep'],tell:['narrate']}[norm(answer.split(',')[0])]||[]).some(x=>norm(x)===a)}function classOk(input,answer){return norm(input)===norm(answer)||({'preposition':['prep'],'adverb':['adv'],'1CV':['first conjugation verb','1st conjugation verb'],'2CV':['second conjugation verb'],'3CV':['third conjugation verb'],'3ioCV':['third io conjugation verb'],'1DN':['first declension noun'],'2DN':['second declension noun'],'3DN':['third declension noun'],'3DA':['third declension adjective'],'1,2DA':['first second declension adjective']}[answer]||[]).some(x=>norm(x)===norm(input))}function render(){s.textContent='Score: '+score+' / '+(order.length*3);bar.style.width=(pos/order.length*100)+'%';if(pos>=order.length){p.textContent='Finished!';bar.style.width='100%';q.innerHTML='<div class="word">Quiz complete! 🎉</div><h2 style="text-align:center">'+score+' / '+(order.length*3)+'</h2><p style="text-align:center">Missed words: '+missed.length+'</p><button id="retry" '+(missed.length?'':'disabled')+'>Retry missed words</button><button id="restart" class="secondary">Restart all 25 words</button>';document.getElementById('retry').onclick=()=>start(missed);document.getElementById('restart').onclick=()=>start(words.map((_,i)=>i));return}const w=words[order[pos]];p.textContent='Word '+(pos+1)+' of '+order.length;q.innerHTML='<div class="word">'+w[0]+'</div><label for="parts">Principal parts</label><input id="parts" autocomplete="off" placeholder="Type all principal parts"><label for="meaning">English meaning</label><input id="meaning" autocomplete="off" placeholder="Type the meaning"><label for="cls">Classification</label><input id="cls" autocomplete="off" placeholder="e.g. 1CV, 3DN, adverb"><div id="feedback"></div><button id="action">Check Answer</button>';document.getElementById('action').onclick=check;document.querySelectorAll('input').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('action').click()}}))}function check(){const w=words[order[pos]],a=[partsOk(document.getElementById('parts').value,w[1]),meaningOk(document.getElementById('meaning').value,w[2]),classOk(document.getElementById('cls').value,w[3])],points=a.filter(Boolean).length;score+=points;if(points<3)missed.push(order[pos]);const labels=['Principal parts','Meaning','Classification'];document.getElementById('feedback').innerHTML='<div class="feedback"><strong>'+points+' / 3 points</strong>'+a.map((ok,i)=>'<div class="line '+(ok?'ok':'bad')+'">'+(ok?'✓':'✗')+' '+labels[i]+': <strong>'+w[i+1]+'</strong></div>').join('')+'</div>';document.querySelectorAll('input').forEach(el=>el.disabled=true);const btn=document.getElementById('action');btn.textContent=pos===order.length-1?'See final score':'Next word →';btn.onclick=()=>{pos++;render()};s.textContent='Score: '+score+' / '+(order.length*3)}function start(indices){order=[...indices];pos=0;score=0;missed=[];render()}render();</script></body></html>
